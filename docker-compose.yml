version: "3.9"  # optional since v1.27.0
services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourPassword123!"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql


  api:
    build:
      context: .
      dockerfile: Dockerfile
      
    ports:
      - "8080:8080"

    depends_on:
      - sqlserver

    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=RealEstatePosting;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True"


volumes:
  sqlserver_data:
